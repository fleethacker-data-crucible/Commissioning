  <path d="M 1314 600 L 1434 600" fill="none" stroke="#c9a66b" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)" class="draw" pathLength="1"/><circle cx="1374" cy="566" r="17" fill="#c9a66b"/><text x="1374" y="574" fill="#071a26" font-size="22" font-weight="800" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="middle">4</text>
  <rect x="1440" y="744" width="420" height="176" rx="10" fill="#112d40" stroke="#24465e" stroke-width="1"/><text x="1464" y="788" fill="#c9a66b" font-size="32" font-weight="700" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start">Lazarette</text><text x="1464" y="828" fill="#a9b4ba" font-size="23" font-weight="400" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start">the vault, opt-in: Git tokens</text><text x="1464" y="858" fill="#a9b4ba" font-size="23" font-weight="400" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start">by name; also holds the</text><text x="1464" y="888" fill="#a9b4ba" font-size="23" font-weight="400" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start">provider key Fairlead uses</text>
