<g data-step="3">
  <text x="1440" y="236" fill="#c9a66b" font-size="20" font-weight="700" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start" letter-spacing="3">YOUR GIT HOST</text>
