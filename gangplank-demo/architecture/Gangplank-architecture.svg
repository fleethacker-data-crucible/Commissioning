  <rect x="510" y="262" width="800" height="138" rx="10" fill="#112d40" stroke="#24465e" stroke-width="1"/>
  <text x="540" y="308" fill="#f4ead6" font-size="30" font-weight="700" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start">Your browser: the Gangplank page</text>
  <text x="540" y="350" fill="#a9b4ba" font-size="25" font-weight="400" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start">Connect, Start, Smart Save, Review, Audit</text>
  <text x="540" y="380" fill="#a9b4ba" font-size="22" font-weight="400" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start">No git.exe, Node or Python needed on the PC</text>
  <rect x="510" y="456" width="800" height="230" rx="10" fill="#112d40" stroke="#24465e" stroke-width="1"/>
  <text x="540" y="500" fill="#f4ead6" font-size="30" font-weight="700" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start">Gangplank server (PowerShell 5.1)</text>
  <text x="540" y="540" fill="#a9b4ba" font-size="23" font-weight="400" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start">listens on 127.0.0.1 · one-time launch link, then a cookie</text>
  <text x="540" y="574" fill="#a9b4ba" font-size="23" font-weight="400" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start">checks Host, Origin and caller · stops when the tab closes</text>
