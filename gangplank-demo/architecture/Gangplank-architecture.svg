  <rect x="510" y="794" width="440" height="106" rx="10" fill="#183a52" stroke="#24465e" stroke-width="1"/><text x="530" y="834" fill="#f4ead6" font-size="25" font-weight="700" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start">Your workspace folder</text><text x="530" y="870" fill="#a9b4ba" font-size="23" font-weight="400" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start">one folder per branch</text>
