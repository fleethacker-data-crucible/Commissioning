  <rect x="240" y="965" width="380" height="54" rx="6" fill="#4fb38626" stroke="#4fb386" stroke-width="1"/><text x="430" y="1000" fill="#f4ead6" font-size="24" font-weight="600" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="middle">Your own branch only</text>
  <rect x="640" y="965" width="400" height="54" rx="6" fill="#4fb38626" stroke="#4fb386" stroke-width="1"/><text x="840" y="1000" fill="#f4ead6" font-size="24" font-weight="600" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="middle">Stops if the branch moved</text>
  <rect x="1060" y="965" width="390" height="54" rx="6" fill="#4fb38626" stroke="#4fb386" stroke-width="1"/><text x="1255" y="1000" fill="#f4ead6" font-size="24" font-weight="600" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="middle">Secrets blocked, writes audited</text>
  <rect x="1470" y="965" width="370" height="54" rx="6" fill="#4fb38626" stroke="#4fb386" stroke-width="1"/><text x="1655" y="1000" fill="#f4ead6" font-size="24" font-weight="600" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="middle">You confirm every write</text>
