<rect width="1920" height="1080" fill="#071a26"/>
<text x="60" y="70" fill="#c9a66b" font-size="22" font-weight="700" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start" letter-spacing="6">HOW GANGPLANK WORKS</text>
<text x="60" y="128" fill="#f4ead6" font-size="50" font-weight="700" font-family="Cambria, 'Cambria Math', Georgia, serif" text-anchor="start">Gangplank: architecture at a glance</text>
<text x="60" y="168" fill="#a9b4ba" font-size="26" font-weight="400" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start">A browser workspace that puts people without Git training on their own branch, with every write checked and logged.</text>
<g data-step="1">
  <rect x="470" y="196" width="880" height="724" rx="22" fill="#0d2636" stroke="#c9a66b" stroke-width="2" stroke-dasharray="10 8"/>
