<?xml version="1.0" encoding="UTF-8"?>
<svg id="arch" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" class="static">
<style>
  .bg{fill:url(#g)}
  .kick{fill:#E2B04A;font-size:26px;font-weight:600;letter-spacing:5px}
  .head{fill:#E8EDF5;font-size:58px;font-weight:700}
  .frame{fill:rgba(255,255,255,0.025);stroke:#5b6b86;stroke-width:2;stroke-dasharray:3 9;stroke-linecap:round}
  .ftag{fill:#8FA0BB;font-size:24px;letter-spacing:2px;font-weight:600}
  .box{fill:#12203d;stroke:#3d527a;stroke-width:2.5}
  .eng{fill:#0f1c38;stroke:#E2B04A;stroke-width:3}
  .gold{fill:#2a2412;stroke:#E2B04A;stroke-width:3}
  .plan{fill:rgba(255,255,255,0.03);stroke:#E2B04A;stroke-width:2.5;stroke-dasharray:10 8}
  .t{fill:#E8EDF5;font-size:32px;font-weight:700}
  .tg{fill:#E2B04A;font-size:32px;font-weight:700}
  .s{fill:#AAB7CA;font-size:24px}
  .sg{fill:#E9C77A;font-size:24px}
  .tag{fill:#E2B04A;font-size:22px;font-weight:700;letter-spacing:1px}
  .ln{fill:none;stroke:#8FA0BB;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .lg{fill:none;stroke:#E2B04A;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  .banner{fill:#E2B04A}
  .bt{fill:#0A1428;font-size:34px;font-weight:700}
  .st{opacity:0;transform:translateY(16px);transition:opacity .8s ease,transform .8s ease}
  .st.on{opacity:1;transform:none}
  .st .dash{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.1s ease .25s}
  .st.on .dash{stroke-dashoffset:0}
  .st.on.cur .box,.st.on.cur .eng,.st.on.cur .plan{stroke:#F3CB72;filter:drop-shadow(0 0 12px rgba(226,176,74,.55))}
  .st.on.cur .gold{filter:drop-shadow(0 0 16px rgba(226,176,74,.7))}
  @keyframes pulse{0%,100%{filter:drop-shadow(0 0 4px rgba(226,176,74,.3))}50%{filter:drop-shadow(0 0 22px rgba(226,176,74,.95))}}
  .pulse .banner{animation:pulse 1.8s ease-in-out infinite}
  .static .st{opacity:1;transform:none;transition:none}
  .static .st .dash{stroke-dashoffset:0;transition:none}
  .static .st.cur .box{filter:none}
</style>
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0A1428"></stop><stop offset="1" stop-color="#0d1a33"></stop></linearGradient>
  <marker id="ah" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#8FA0BB"></path></marker>
  <marker id="ag" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#E2B04A"></path></marker>
</defs>
<rect class="bg" width="1920" height="1080"></rect>

<text class="kick" x="80" y="70">PACKETRAT · ARCHITECTURE AT A GLANCE</text>
<text class="head" x="80" y="130">Sorts. A person decides.</text>

<!-- step 1: what it is: the engine on this PC -->
<g class="st on" data-s="1">
  <rect class="frame" x="520" y="175" width="860" height="835" rx="30"></rect>
  <text class="ftag" x="552" y="215">ON YOUR PC · LOOPBACK ONLY</text>
  <rect class="eng" x="556" y="250" width="788" height="400" rx="24"></rect>
  <text class="tg" x="584" y="298">PacketRat engine · PowerShell 5.1</text>
  <text class="s" x="584" y="336">turns an inbox into a short action queue</text>
</g>

<!-- step 2: mail in -->
<g class="st on" data-s="2">
  <rect class="frame" x="60" y="175" width="400" height="835" rx="30"></rect>
  <text class="ftag" x="92" y="215">MAIL IN</text>
  <rect class="gold" x="92" y="250" width="336" height="200" rx="18"></rect>
  <text class="tg" x="116" y="300">Exported files</text>
  <text class="sg" x="116" y="338">.eml and .msg</text>
  <text class="sg" x="116" y="372">read in this demo</text>
  <text class="tag" x="116" y="420">VERIFIED HERE</text>
  <rect class="plan" x="92" y="480" width="336" height="200" rx="18"></rect>
  <text class="t" x="116" y="530">Classic Outlook</text>
  <text class="s" x="116" y="568">COM · reads the inbox</text>
  <text class="tag" x="116" y="650">NOT VERIFIED LIVE</text>
  <rect class="plan" x="92" y="710" width="336" height="200" rx="18"></rect>
  <text class="t" x="116" y="760">Microsoft Graph</text>
  <text class="s" x="116" y="798">needs org sign-in</text>
  <text class="tag" x="116" y="880">NOT VERIFIED LIVE</text>
  <path class="lg dash" pathLength="1" d="M432 350 C490 350 500 440 552 440" marker-end="url(#ag)"></path>
  <path class="ln dash" pathLength="1" d="M432 580 C490 580 500 480 552 470" marker-end="url(#ah)"></path>
  <path class="ln dash" pathLength="1" d="M432 810 C510 810 520 520 552 500" marker-end="url(#ah)"></path>
</g>

<!-- step 3: the pieces on this PC -->
<g class="st on" data-s="3">
  <rect class="box" x="556" y="690" width="244" height="190" rx="18"></rect>
  <text class="t" x="578" y="740">Launcher</text>
  <text class="s" x="578" y="778">Launch-PacketRat</text>
  <text class="s" x="578" y="812">starts the service</text>
  <rect class="box" x="828" y="690" width="244" height="190" rx="18"></rect>
  <text class="t" x="850" y="740">Browser UI</text>
  <text class="s" x="850" y="778">port 8766 default</text>
  <text class="s" x="850" y="812">nonce-checked</text>
  <rect class="box" x="1100" y="690" width="244" height="190" rx="18"></rect>
  <text class="t" x="1122" y="740">Data folder</text>
  <text class="s" x="1122" y="778">queue · rules</text>
  <text class="s" x="1122" y="812">dismissals · log</text>
  <path class="ln dash" pathLength="1" d="M678 686 V654" marker-end="url(#ah)"></path>
  <path class="ln dash" pathLength="1" d="M950 686 V654" marker-start="url(#ah)" marker-end="url(#ah)"></path>
  <path class="ln dash" pathLength="1" d="M1222 686 V654" marker-start="url(#ah)" marker-end="url(#ah)"></path>
  <text class="s" x="556" y="940">Plain HTML and JavaScript in the browser.</text>
  <text class="s" x="556" y="974">Nothing to install, no admin rights.</text>
</g>

<!-- step 4: Fairlead, Lazarette, OpenAI -->
<g class="st on" data-s="4">
  <rect class="box" x="1440" y="175" width="420" height="110" rx="22"></rect>
  <text class="t" x="1466" y="222">OpenAI</text>
  <text class="s" x="1466" y="260">or a local model</text>
  <rect class="box" x="1440" y="330" width="420" height="180" rx="22"></rect>
  <text class="t" x="1466" y="378">Fairlead</text>
  <text class="tag" x="1625" y="377">:8776</text>
  <text class="s" x="1466" y="416">model router · the only way</text>
  <text class="s" x="1466" y="450">to a model. PacketRat's key</text>
  <text class="s" x="1466" y="484">sits in Credential Manager</text>
  <rect class="box" x="1440" y="555" width="420" height="130" rx="22"></rect>
  <text class="t" x="1466" y="603">Lazarette vault</text>
  <text class="s" x="1466" y="641">holds the OpenAI key,</text>
  <text class="s" x="1466" y="672">shared by name</text>
  <path class="ln dash" pathLength="1" d="M1348 430 L1436 420" marker-end="url(#ah)"></path>
  <path class="ln dash" pathLength="1" d="M1650 326 V290" marker-end="url(#ah)"></path>
  <path class="lg dash" pathLength="1" d="M1650 551 V514" marker-end="url(#ag)"></path>
</g>

<!-- step 5: how a message is decided -->
<g class="st on" data-s="5">
  <rect class="box" x="584" y="380" width="232" height="230" rx="16"></rect>
  <text class="t" x="606" y="428">1 Model</text>
  <text class="s" x="606" y="470">suggests a</text>
  <text class="s" x="606" y="504">priority and</text>
  <text class="s" x="606" y="538">a reason</text>
  <rect class="box" x="834" y="380" width="232" height="230" rx="16"></rect>
  <text class="t" x="856" y="428">2 Rules</text>
  <text class="s" x="856" y="470">editable, in</text>
  <text class="s" x="856" y="504">order, first</text>
  <text class="s" x="856" y="538">match wins</text>
  <rect class="gold" x="1084" y="380" width="232" height="230" rx="16"></rect>
  <text class="tg" x="1106" y="428">3 You</text>
  <text class="sg" x="1106" y="470">overrides and</text>
  <text class="sg" x="1106" y="504">dismissals win</text>
  <text class="sg" x="1106" y="538">over both</text>
  <path class="ln dash" pathLength="1" d="M820 495 H830" marker-end="url(#ah)"></path>
  <path class="ln dash" pathLength="1" d="M1070 495 H1080" marker-end="url(#ah)"></path>
</g>

<!-- step 6: what comes out -->
<g class="st on" data-s="6">
  <rect class="box" x="1440" y="725" width="420" height="88" rx="18"></rect>
  <text class="t" x="1464" y="765">Outlook draft</text>
  <text class="s" x="1464" y="798">a person reviews and sends</text>
  <rect class="box" x="1440" y="833" width="420" height="88" rx="18"></rect>
  <text class="t" x="1464" y="873">Counts file</text>
  <text class="s" x="1464" y="906">CSV for Semaphore</text>
  <rect class="box" x="1440" y="941" width="420" height="88" rx="18"></rect>
  <text class="t" x="1464" y="981">Hand-off file</text>
  <text class="s" x="1464" y="1014">backlog item for Halyard</text>
  <path class="ln dash" pathLength="1" d="M1348 600 C1396 640 1400 740 1436 760" marker-end="url(#ah)"></path>
  <path class="ln dash" pathLength="1" d="M1348 624 C1400 700 1400 860 1436 878" marker-end="url(#ah)"></path>
  <path class="ln dash" pathLength="1" d="M1348 640 C1380 760 1390 960 1436 984" marker-end="url(#ah)"></path>
  <text class="tag" x="1716" y="765">UNVERIFIED</text>
  <text class="tag" x="1716" y="873">UNVERIFIED</text>
  <text class="tag" x="1716" y="981">UNVERIFIED</text>
</g>

<!-- step 7: the rule -->
<g class="st on" data-s="7">
  <rect class="banner" x="950" y="42" width="910" height="100" rx="50"></rect>
  <text class="bt" x="1405" y="105" text-anchor="middle">Never sends or deletes mail.</text>
</g>
</svg>
