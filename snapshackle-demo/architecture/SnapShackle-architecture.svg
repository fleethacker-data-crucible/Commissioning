<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" class=""><style>.draw{stroke-dasharray:1;stroke-dashoffset:0}</style><defs>
  <radialGradient id="bg" cx="50%" cy="30%" r="80%"><stop offset="0" stop-color="#13224a"/><stop offset="1" stop-color="#0a1428"/></radialGradient>
  <marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M1 1.5 L11 6 L1 10.5 Z" fill="#e2b04a"/></marker>
  <marker id="ahs" viewBox="0 0 12 12" refX="2" refY="6" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M11 1.5 L1 6 L11 10.5 Z" fill="#e2b04a"/></marker>
</defs>
<rect width="1920" height="1080" fill="url(#bg)"/>
<text x="60" y="70" fill="#e2b04a" font-size="22" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start" letter-spacing="6">HOW SNAPSHACKLE WORKS</text>
<text x="60" y="128" fill="#e8edf5" font-size="50" font-weight="700" font-family="Georgia, 'Times New Roman', serif" text-anchor="start">SnapShackle: architecture at a glance</text>
<text x="60" y="168" fill="#aab7ca" font-size="26" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">Capture, annotate, redact and keep screenshots on one computer. You decide what leaves it.</text>
<g data-step="1">
  <rect x="470" y="196" width="880" height="724" rx="22" fill="#0d1a36" stroke="#e2b04a" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="500" y="236" fill="#e2b04a" font-size="20" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start" letter-spacing="3">THIS COMPUTER  ·  loopback only</text>
  <rect x="510" y="262" width="800" height="222" rx="12" fill="#101f3d" stroke="#2a3f6b" stroke-width="2"/>
  <text x="540" y="308" fill="#e8edf5" font-size="30" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">The studio, in your browser</text>
  <rect x="540" y="330" width="360" height="108" rx="10" fill="#17294f" stroke="#2a3f6b" stroke-width="2"/><text x="560" y="366" fill="#5fb3d0" font-size="26" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">Editor</text><text x="560" y="402" fill="#aab7ca" font-size="24" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">arrows, boxes, steps, text</text>
  <rect x="920" y="330" width="360" height="108" rx="10" fill="#17294f" stroke="#2a3f6b" stroke-width="2"/><text x="940" y="366" fill="#6fcf97" font-size="26" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">Smart redaction</text><text x="940" y="402" fill="#aab7ca" font-size="24" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">finds secrets, covers them</text>
  <text x="540" y="468" fill="#aab7ca" font-size="21" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">plain JavaScript and canvas, no CDN, works offline</text>
  <rect x="510" y="558" width="800" height="178" rx="12" fill="#101f3d" stroke="#2a3f6b" stroke-width="2"/>
  <text x="540" y="604" fill="#e8edf5" font-size="30" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">SnapShackle host (PowerShell 5.1)</text>
  <text x="540" y="646" fill="#aab7ca" font-size="24" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">native capture, Windows OCR, library, share</text>
  <text x="540" y="684" fill="#aab7ca" font-size="24" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">127.0.0.1 only, session token on every request</text>
  <text x="540" y="718" fill="#aab7ca" font-size="24" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">one action list feeds the studio, CLI and API</text>
