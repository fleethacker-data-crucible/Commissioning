  <text x="90" y="1000" fill="#6fcf97" font-size="22" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start" letter-spacing="4">SAFETY</text>
  <rect x="240" y="965" width="380" height="54" rx="27" fill="#6fcf9722" stroke="#6fcf97" stroke-width="2"/><text x="430" y="1000" fill="#e8edf5" font-size="23" font-weight="600" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">Loopback + session token</text>
  <rect x="640" y="965" width="420" height="54" rx="27" fill="#6fcf9722" stroke="#6fcf97" stroke-width="2"/><text x="850" y="1000" fill="#e8edf5" font-size="23" font-weight="600" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">SnapShackle uploads nothing</text>
  <rect x="1080" y="965" width="380" height="54" rx="27" fill="#6fcf9722" stroke="#6fcf97" stroke-width="2"/><text x="1270" y="1000" fill="#e8edf5" font-size="23" font-weight="600" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">AI is off until you turn it on</text>
  <rect x="1480" y="965" width="360" height="54" rx="27" fill="#6fcf9722" stroke="#6fcf97" stroke-width="2"/><text x="1660" y="1000" fill="#e8edf5" font-size="23" font-weight="600" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">You tick every suggestion</text>
