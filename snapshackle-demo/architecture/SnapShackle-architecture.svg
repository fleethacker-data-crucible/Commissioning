</g>
<g data-step="4">
  <text x="60" y="482" fill="#e2b04a" font-size="20" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start" letter-spacing="3">WHAT COMES OUT</text>
  <rect x="60" y="500" width="360" height="180" rx="12" fill="#101f3d" stroke="#6fcf97" stroke-width="2"/><text x="84" y="542" fill="#6fcf97" font-size="28" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">A file you chose</text><text x="84" y="580" fill="#aab7ca" font-size="22" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">flattened PNG, clipboard, or a</text><text x="84" y="611" fill="#aab7ca" font-size="22" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">copy into a share folder you set;</text><text x="84" y="642" fill="#aab7ca" font-size="22" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">editable project kept separately</text>
