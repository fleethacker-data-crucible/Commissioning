<g data-step="3">
  <text x="60" y="236" fill="#e2b04a" font-size="20" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start" letter-spacing="3">WHAT GOES IN</text>
  <rect x="60" y="262" width="360" height="186" rx="12" fill="#101f3d" stroke="#2a3f6b" stroke-width="2"/><text x="84" y="306" fill="#f3d58d" font-size="32" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">Pixels on this PC</text><text x="84" y="346" fill="#aab7ca" font-size="23" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">a region, a window or a screen</text><text x="84" y="378" fill="#aab7ca" font-size="23" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">(PrintWindow, GDI), or an image</text><text x="84" y="410" fill="#aab7ca" font-size="23" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">you open, paste or drop in</text>
