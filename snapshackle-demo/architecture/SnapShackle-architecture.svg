<g data-step="5">
  <text x="1440" y="236" fill="#e2b04a" font-size="20" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start" letter-spacing="3">FLEET TOOLS · OPTIONAL AI</text>
  <rect x="1440" y="262" width="420" height="150" rx="12" fill="#101f3d" stroke="#2a3f6b" stroke-width="2"/><text x="1464" y="306" fill="#f3d58d" font-size="32" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">Lazarette</text><text x="1464" y="346" fill="#aab7ca" font-size="23" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">holds the provider key for</text><text x="1464" y="378" fill="#aab7ca" font-size="23" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">Fairlead. Not linked to SnapShackle</text>
  <path d="M 1650 416 L 1650 462" fill="none" stroke="#5fb3d0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)" class="draw" pathLength="1"/><text x="1672" y="446" fill="#5fb3d0" font-size="18" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">key shared to Fairlead</text>
  <rect x="1440" y="466" width="420" height="214" rx="12" fill="#101f3d" stroke="#2a3f6b" stroke-width="2"/><text x="1464" y="510" fill="#f3d58d" font-size="32" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">Fairlead</text><text x="1464" y="550" fill="#aab7ca" font-size="22" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">model router, 127.0.0.1:8776</text><text x="1464" y="580" fill="#aab7ca" font-size="22" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">SnapShackle's own client key,</text><text x="1464" y="610" fill="#aab7ca" font-size="22" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">installed in Credential Manager;</text><text x="1464" y="640" fill="#aab7ca" font-size="22" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">local-only unless you allow any</text>
  <path d="M 1310 640 H 1436" fill="none" stroke="#e2b04a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)" class="draw" pathLength="1"/><circle cx="1373" cy="612" r="17" fill="#e2b04a"/><text x="1373" y="620" fill="#0a1428" font-size="22" font-weight="800" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">4</text>
  <path d="M 1650 684 L 1650 722" fill="none" stroke="#e2b04a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)" class="draw" pathLength="1"/><text x="1672" y="708" fill="#aab7ca" font-size="18" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">request</text>
  <rect x="1440" y="726" width="420" height="96" rx="12" fill="#101f3d" stroke="#2a3f6b" stroke-width="2"/><text x="1464" y="768" fill="#f3d58d" font-size="30" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">The model</text><text x="1464" y="802" fill="#aab7ca" font-size="22" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">alt text, suggestions you tick</text>
</g>
<g data-step="6">
  <text x="60" y="716" fill="#e2b04a" font-size="20" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start" letter-spacing="3">HANDS OFF TO</text>
  <rect x="60" y="732" width="360" height="176" rx="12" fill="#101f3d" stroke="#2a3f6b" stroke-width="2"/><text x="84" y="774" fill="#f3d58d" font-size="20" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">Bowerbird · Capstan · Scrimshaw</text><text x="84" y="812" fill="#aab7ca" font-size="22" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">handoff.ps1 reads the data folder,</text><text x="84" y="842" fill="#aab7ca" font-size="22" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">copies chosen captures plus a</text><text x="84" y="872" fill="#aab7ca" font-size="22" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">manifest; their import is theirs</text>
