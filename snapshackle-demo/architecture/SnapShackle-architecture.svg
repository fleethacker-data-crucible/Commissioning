  <path d="M 675 794 L 675 740" fill="none" stroke="#e2b04a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)" class="draw" pathLength="1"/><circle cx="715" cy="767" r="17" fill="#e2b04a"/><text x="715" y="775" fill="#0a1428" font-size="22" font-weight="800" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">1</text><text x="740" y="773" fill="#aab7ca" font-size="18" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">starts it</text>
  <path d="M 910 554 L 910 490" fill="none" stroke="#e2b04a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)" marker-start="url(#ahs)" class="draw" pathLength="1"/><circle cx="950" cy="522" r="17" fill="#e2b04a"/><text x="950" y="530" fill="#0a1428" font-size="22" font-weight="800" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">2</text><text x="975" y="528" fill="#aab7ca" font-size="18" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">serves the page, takes calls</text>
</g>
<g data-step="2">
  <rect x="870" y="794" width="440" height="106" rx="10" fill="#17294f" stroke="#2a3f6b" stroke-width="2"/><text x="890" y="832" fill="#f3d58d" font-size="24" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">Local data folder</text><text x="890" y="866" fill="#aab7ca" font-size="21" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">PNG + .meta.json, settings, logs</text>
  <path d="M 1310 700 H 1332 V 847 H 1314" fill="none" stroke="#e2b04a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)" class="draw" pathLength="1"/><circle cx="1332" cy="775" r="17" fill="#e2b04a"/><text x="1332" y="783" fill="#0a1428" font-size="22" font-weight="800" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">3</text>
