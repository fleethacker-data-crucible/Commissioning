<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif">
<title>Bridge Warden at a glance</title>
<style>
.g{transition:opacity .8s ease, transform .8s ease}
svg.anim .g{opacity:0;transform:translateY(12px)}
svg.anim .g.show{opacity:1;transform:none}
.serif{font-family:Cambria,Georgia,'Times New Roman',serif}
.arrow{stroke:#c9a66b;stroke-width:6;fill:none;stroke-linecap:round}
.lab{font-size:27px;fill:#e2c48a;font-weight:600}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b2434"/><stop offset="1" stop-color="#061620"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14344a"/><stop offset="1" stop-color="#0f2b3d"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c9a66b"/><stop offset="1" stop-color="#c9a66b" stop-opacity="0"/></linearGradient>
<marker id="ah" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" refX="14" refY="11" orient="auto"><path d="M2 3 L18 11 L2 19 Z" fill="#c9a66b"/></marker>
</defs>
<rect width="1920" height="1080" fill="url(#bg)"/>
<g opacity=".07" transform="translate(1560 760)" stroke="#c9a66b" fill="none" stroke-width="3"><circle r="210"/><circle r="150"/><path d="M0 -300 L26 -26 L300 0 L26 26 L0 300 L-26 26 L-300 0 L-26 -26 Z"/></g>
<text x="80" y="82" font-size="60" font-weight="700" fill="#f4ead6" class="serif">Bridge <tspan fill="#c9a66b">Warden</tspan> at a glance</text>
<rect x="80" y="100" width="520" height="4" fill="url(#gold)"/>
<text x="1840" y="76" font-size="28" fill="#a9b4ba" text-anchor="end">a governance layer between AI agents and the ship</text>

<g class="g b1"><rect x="80" y="136" width="430" height="160" rx="20" fill="url(#card)" stroke="#34597a" stroke-width="3"/><g transform="translate(104,182)"><g fill="none" stroke="#e2c48a" stroke-width="4"><circle cx="34" cy="34" r="9"/><circle cx="10" cy="12" r="6"/><circle cx="58" cy="12" r="6"/><circle cx="10" cy="56" r="6"/><circle cx="58" cy="56" r="6"/><path d="M14 16 L27 28 M54 16 L41 28 M14 52 L27 40 M54 52 L41 40"/></g></g><text x="200" y="210" font-size="36" font-weight="700" fill="#f4ead6">13 AI agents</text><text x="200" y="250" font-size="27" fill="#a9b4ba">lookouts + deciders</text></g>
<g class="g b1"><rect x="729" y="124" width="462" height="184" rx="26" fill="none" stroke="#c9a66b" stroke-opacity=".25" stroke-width="8"/><rect x="735" y="130" width="450" height="172" rx="20" fill="url(#card)" stroke="#c9a66b" stroke-width="4"/><g transform="translate(759,182)"><g fill="none" stroke="#e2c48a" stroke-width="4"><path d="M34 4 L60 14 V36 C60 52 48 62 34 68 C20 62 8 52 8 36 V14 Z"/><path d="M22 36 L31 46 L48 26" stroke-width="5"/></g></g><text x="855" y="210" font-size="36" font-weight="700" fill="#c9a66b">BRIDGE WARDEN</text><text x="855" y="250" font-size="27" fill="#a9b4ba">checks every order first</text></g>
<g class="g b1"><rect x="1410" y="136" width="430" height="160" rx="20" fill="url(#card)" stroke="#34597a" stroke-width="3"/><g transform="translate(1434,182)"><g fill="none" stroke="#e2c48a" stroke-width="4"><path d="M4 44 H64 L54 60 H14 Z"/><path d="M34 44 V12 L52 30 H34"/></g></g><text x="1530" y="210" font-size="36" font-weight="700" fill="#f4ead6">The ship</text><text x="1530" y="250" font-size="27" fill="#a9b4ba">a synthetic simulation</text></g>
<g class="g b1"><path class="arrow" d="M518 216 H722" marker-end="url(#ah)"/><text class="lab" x="620" y="196" text-anchor="middle">recommend</text><path class="arrow" d="M1193 216 H1398" marker-end="url(#ah)"/><text class="lab" x="1295" y="196" text-anchor="middle">approved only</text></g>
<g class="g b2"><rect x="80" y="330" width="880" height="340" rx="24" fill="none" stroke="#34597a" stroke-width="3" stroke-dasharray="4 10"/><text x="112" y="376" font-size="34" font-weight="700" fill="#c9a66b" class="serif">On your PC</text></g>
