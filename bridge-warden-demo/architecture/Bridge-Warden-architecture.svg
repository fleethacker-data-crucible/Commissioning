<g class="g b2"><rect x="520" y="396" width="420" height="120" rx="20" fill="url(#card)" stroke="#34597a" stroke-width="3"/><g transform="translate(544,422)"><g fill="none" stroke="#e2c48a" stroke-width="4"><rect x="4" y="10" width="38" height="30" rx="4"/><rect x="26" y="26" width="38" height="30" rx="4" fill="#112d40"/></g></g><text x="640" y="450" font-size="34" font-weight="700" fill="#f4ead6">Two windows</text><text x="640" y="490" font-size="26" fill="#a9b4ba">127.0.0.1:8774 only</text></g>
<g class="g b2"><rect x="104" y="534" width="420" height="120" rx="20" fill="url(#card)" stroke="#34597a" stroke-width="3"/><g transform="translate(128,560)"><g fill="none" stroke="#e2c48a" stroke-width="4"><circle cx="34" cy="34" r="12"/><path d="M34 6 V16 M34 52 V62 M6 34 H16 M52 34 H62 M14 14 L21 21 M47 47 L54 54 M54 14 L47 21 M21 47 L14 54"/></g></g><text x="224" y="588" font-size="34" font-weight="700" fill="#f4ead6">Warden engine</text><text x="224" y="628" font-size="26" fill="#a9b4ba">8 checks, 13 agents</text></g>
<g class="g b2"><rect x="520" y="534" width="420" height="120" rx="20" fill="url(#card)" stroke="#34597a" stroke-width="3"/><g transform="translate(544,560)"><g fill="none" stroke="#e2c48a" stroke-width="4"><rect x="8" y="6" width="22" height="16" rx="3"/><rect x="38" y="24" width="22" height="16" rx="3"/><rect x="8" y="46" width="22" height="16" rx="3"/><path d="M30 14 H34 V32 H38 M34 32 V54 H30"/></g></g><text x="640" y="588" font-size="34" font-weight="700" fill="#f4ead6">Ledger</text><text x="640" y="628" font-size="26" fill="#a9b4ba">hash-chained SQLite</text></g>
<g class="g b4"><rect x="1000" y="330" width="840" height="340" rx="24" fill="none" stroke="#34597a" stroke-width="3" stroke-dasharray="4 10"/><text x="1032" y="376" font-size="34" font-weight="700" fill="#5ec8e0" class="serif">Fleet tools</text></g>
<g class="g b4"><rect x="1024" y="396" width="792" height="124" rx="20" fill="url(#card)" stroke="#5ec8e0" stroke-width="3"/><g transform="translate(1048,424)"><g fill="none" stroke="#5ec8e0" stroke-width="4"><circle cx="34" cy="34" r="8"/><circle cx="8" cy="34" r="5"/><circle cx="60" cy="14" r="5"/><circle cx="60" cy="54" r="5"/><path d="M13 34 H26 M41 30 L56 17 M41 38 L56 51"/></g></g><text x="1144" y="452" font-size="34" font-weight="700" fill="#5ec8e0">Fairlead  127.0.0.1:8776</text><text x="1144" y="492" font-size="26" fill="#a9b4ba">every model call, OpenAI-compatible /v1</text></g>
<g class="g b4"><rect x="1024" y="540" width="500" height="116" rx="20" fill="url(#card)" stroke="#34597a" stroke-width="3"/><g transform="translate(1048,564)"><g fill="none" stroke="#e2c48a" stroke-width="4"><circle cx="20" cy="34" r="13"/><path d="M33 34 H62 M52 34 V46 M44 34 V42"/></g></g><text x="1144" y="592" font-size="32" font-weight="700" fill="#f4ead6">Credential Manager</text><text x="1144" y="632" font-size="26" fill="#a9b4ba">Fairlead\BridgeWarden key</text></g>
<g class="g b4"><rect x="1548" y="540" width="268" height="116" rx="20" fill="url(#card)" stroke="#34597a" stroke-width="3"/><g transform="translate(1572,564)"><g fill="none" stroke="#e2c48a" stroke-width="4"><rect x="6" y="10" width="56" height="46" rx="6"/><circle cx="34" cy="33" r="10"/><path d="M34 33 L42 27"/></g></g><text x="1668" y="592" font-size="30" font-weight="700" fill="#f4ead6">Lazarette</text><text x="1668" y="632" font-size="24" fill="#a9b4ba">provider key</text></g>
<g class="g b4"><path class="arrow" d="M968 458 H1012" marker-end="url(#ah)"/><path class="arrow" d="M968 598 H1012" marker-end="url(#ah)"/><path class="arrow" d="M1682 540 V522" marker-end="url(#ah)"/><text class="lab" x="1432" y="700" text-anchor="middle" style="font-size:24px">Bridge Warden never holds a provider key</text></g>
<g class="g b3"><path d="M160 770 H1760" stroke="#34597a" stroke-width="5"/><circle cx="160" cy="770" r="36" fill="#0b2434" stroke="#c9a66b" stroke-width="5"/><text x="160" y="782" font-size="34" font-weight="700" fill="#c9a66b" text-anchor="middle">1</text><text x="160" y="838" font-size="32" font-weight="700" fill="#f4ead6" text-anchor="middle">Watch</text><text x="160" y="872" font-size="27" fill="#a9b4ba" text-anchor="middle">lookouts report</text><path class="arrow" d="M206 770 H514" marker-end="url(#ah)" style="stroke-width:4"/><circle cx="560" cy="770" r="36" fill="#0b2434" stroke="#c9a66b" stroke-width="5"/><text x="560" y="782" font-size="34" font-weight="700" fill="#c9a66b" text-anchor="middle">2</text><text x="560" y="838" font-size="32" font-weight="700" fill="#f4ead6" text-anchor="middle">Decide</text><text x="560" y="872" font-size="27" fill="#a9b4ba" text-anchor="middle">a model picks</text><path class="arrow" d="M606 770 H914" marker-end="url(#ah)" style="stroke-width:4"/><circle cx="960" cy="770" r="36" fill="#0b2434" stroke="#c9a66b" stroke-width="5"/><text x="960" y="782" font-size="34" font-weight="700" fill="#c9a66b" text-anchor="middle">3</text><text x="960" y="838" font-size="32" font-weight="700" fill="#f4ead6" text-anchor="middle">Check</text><text x="960" y="872" font-size="27" fill="#a9b4ba" text-anchor="middle">8 stages</text><path class="arrow" d="M1006 770 H1314" marker-end="url(#ah)" style="stroke-width:4"/><circle cx="1360" cy="770" r="36" fill="#0b2434" stroke="#c9a66b" stroke-width="5"/><text x="1360" y="782" font-size="34" font-weight="700" fill="#c9a66b" text-anchor="middle">4</text><text x="1360" y="838" font-size="32" font-weight="700" fill="#f4ead6" text-anchor="middle">Act or ask</text><text x="1360" y="872" font-size="27" fill="#a9b4ba" text-anchor="middle">the operator</text><path class="arrow" d="M1406 770 H1714" marker-end="url(#ah)" style="stroke-width:4"/><circle cx="1760" cy="770" r="36" fill="#0b2434" stroke="#c9a66b" stroke-width="5"/><text x="1760" y="782" font-size="34" font-weight="700" fill="#c9a66b" text-anchor="middle">5</text><text x="1760" y="838" font-size="32" font-weight="700" fill="#f4ead6" text-anchor="middle">Record</text><text x="1760" y="872" font-size="27" fill="#a9b4ba" text-anchor="middle">in the ledger</text></g>
<g class="g b5"><rect x="80" y="920" width="425" height="120" rx="20" fill="#ef6a5a" fill-opacity=".10" stroke="#ef6a5a" stroke-width="3"/><text x="104" y="974" font-size="34" font-weight="700" fill="#ef6a5a">No tools for AI</text><text x="104" y="1014" font-size="26" fill="#d6dde0">a model that tries is quarantined</text><rect x="525" y="920" width="425" height="120" rx="20" fill="#e0a443" fill-opacity=".10" stroke="#e0a443" stroke-width="3"/><text x="549" y="974" font-size="34" font-weight="700" fill="#e0a443">Humans approve</text><text x="549" y="1014" font-size="26" fill="#d6dde0">weapons and people always wait</text><rect x="970" y="920" width="425" height="120" rx="20" fill="#ef6a5a" fill-opacity=".10" stroke="#ef6a5a" stroke-width="3"/><text x="994" y="974" font-size="34" font-weight="700" fill="#ef6a5a">SAFE-STOP</text><text x="994" y="1014" font-size="26" fill="#d6dde0">hold 2 s: every agent halts</text><rect x="1415" y="920" width="425" height="120" rx="20" fill="#4fb386" fill-opacity=".10" stroke="#4fb386" stroke-width="3"/><text x="1439" y="974" font-size="34" font-weight="700" fill="#4fb386">Tamper-evident</text><text x="1439" y="1014" font-size="26" fill="#d6dde0">a verifiable hash chain</text></g>
<script><![CDATA[
// Standalone: everything is visible. Add #anim to the address and pieces appear when beat(n) is called.
(function(){var svg=document.documentElement; if(location.hash==='#anim') svg.classList.add('anim');
window.beat=function(n){document.querySelectorAll('.b'+n).forEach(function(e){e.classList.add('show')});};})();
]]></script>
</svg>