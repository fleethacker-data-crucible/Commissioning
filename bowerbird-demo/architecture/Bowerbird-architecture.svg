<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Arial, sans-serif"><rect width="1920" height="1080" fill="#0a1428"/><text x="80" y="70" font-size="22" font-weight="700" letter-spacing="6" fill="#e2b04a">FLEET · BOWERBIRD · ARCHITECTURE AT A GLANCE</text><text x="80" y="140" font-size="48" font-weight="700" fill="#e8edf5" font-family="Georgia, serif">Everything runs on this PC. A person approves every move.</text><g><rect x="80" y="215" width="400" height="140" rx="10" fill="#11203d" stroke="#2c4268" stroke-width="2"/><text x="104" y="259" font-size="30" font-weight="700" fill="#e8edf5">Browser tab</text><text x="104" y="295" font-size="23" fill="#aab7ca">Bowerbird Studio</text><text x="104" y="325" font-size="23" fill="#aab7ca">127.0.0.1 · session token</text></g><g><rect x="80" y="420" width="400" height="140" rx="10" fill="#11203d" stroke="#2c4268" stroke-width="2"/><text x="104" y="464" font-size="30" font-weight="700" fill="#e8edf5">Start-Bowerbird.bat</text><text x="104" y="500" font-size="23" fill="#aab7ca">PowerShell 5.1</text><text x="104" y="530" font-size="23" fill="#aab7ca">no install, no admin</text></g><g><line x1="480" y1="285" x2="600" y2="285" stroke="#e2b04a" stroke-width="4"/><polygon points="620,285 598,272 598,298" fill="#e2b04a"/><text x="550" y="271" font-size="21" fill="#e2b04a" text-anchor="middle">local calls</text></g><g><line x1="480" y1="490" x2="600" y2="490" stroke="#e2b04a" stroke-width="4"/><polygon points="620,490 598,477 598,503" fill="#e2b04a"/><text x="550" y="476" font-size="21" fill="#e2b04a" text-anchor="middle">starts</text></g><g><rect x="620" y="195" width="640" height="645" rx="14" fill="none" stroke="#e2b04a" stroke-width="2.5"/><text x="650" y="238" font-size="26" font-weight="700" fill="#e2b04a">BOWERBIRD ENGINE</text></g><g><rect x="650" y="262" width="285" height="160" rx="10" fill="#11203d" stroke="#2c4268" stroke-width="2"/><text x="674" y="306" font-size="30" font-weight="700" fill="#e8edf5">Index and search</text><text x="674" y="342" font-size="23" fill="#aab7ca">SHA-256, image hash</text><text x="674" y="372" font-size="23" fill="#aab7ca">text, duplicates</text></g><g><rect x="955" y="262" width="285" height="160" rx="10" fill="#11203d" stroke="#2c4268" stroke-width="2"/><text x="979" y="306" font-size="30" font-weight="700" fill="#e8edf5">Smart rename</text><text x="979" y="342" font-size="23" fill="#aab7ca">1 file metadata</text><text x="979" y="372" font-size="23" fill="#aab7ca">2 vision, opt-in only</text></g><g><rect x="650" y="440" width="285" height="160" rx="10" fill="#11203d" stroke="#2c4268" stroke-width="2"/><text x="674" y="484" font-size="30" font-weight="700" fill="#e8edf5">Organize</text><text x="674" y="520" font-size="23" fill="#aab7ca">JSON rules</text><text x="674" y="550" font-size="23" fill="#aab7ca">builds a move plan</text></g><g><rect x="955" y="440" width="285" height="160" rx="10" fill="#11203d" stroke="#2c4268" stroke-width="2"/><text x="979" y="484" font-size="30" font-weight="700" fill="#e8edf5">Local agents</text><text x="979" y="520" font-size="23" fill="#aab7ca">read-only analysis</text><text x="979" y="550" font-size="23" fill="#aab7ca">no model needed</text></g><g><rect x="80" y="640" width="400" height="140" rx="10" fill="#11203d" stroke="#2c4268" stroke-width="2"/><text x="104" y="684" font-size="30" font-weight="700" fill="#e8edf5">Your workspace folder</text><text x="104" y="720" font-size="23" fill="#aab7ca">screenshots, documents</text><text x="104" y="750" font-size="23" fill="#aab7ca">one folder you choose</text></g><g><line x1="480" y1="690" x2="600" y2="690" stroke="#e2b04a" stroke-width="4"/><polygon points="620,690 598,677 598,703" fill="#e2b04a"/><text x="550" y="676" font-size="21" fill="#e2b04a" text-anchor="middle">reads</text></g><g><line x1="620" y1="750" x2="500" y2="750" stroke="#f0a030" stroke-width="4"/><polygon points="480,750 502,737 502,763" fill="#f0a030"/><text x="550" y="736" font-size="21" fill="#f0a030" text-anchor="middle">after APPLY</text></g><g><rect x="650" y="628" width="590" height="160" rx="10" fill="#11203d" stroke="#e2b04a" stroke-width="2"/><text x="674" y="672" font-size="30" font-weight="700" fill="#e8edf5">State folder</text><text x="674" y="708" font-size="23" fill="#aab7ca">index encrypted with Windows DPAPI</text><text x="674" y="738" font-size="23" fill="#aab7ca">move plan and undo journal</text></g><g><rect x="1420" y="215" width="420" height="100" rx="10" fill="#11203d" stroke="#2c4268" stroke-width="2"/><text x="1444" y="259" font-size="30" font-weight="700" fill="#e8edf5">Lazarette vault</text><text x="1444" y="295" font-size="23" fill="#aab7ca">OpenAI key, shared by name</text></g><g><line x1="1630" y1="315" x2="1630" y2="350" stroke="#e2b04a" stroke-width="4"/><polygon points="1630,370 1617,348 1643,348" fill="#e2b04a"/></g><g><rect x="1420" y="370" width="420" height="120" rx="10" fill="#11203d" stroke="#5aa2ff" stroke-width="2"/><text x="1444" y="414" font-size="30" font-weight="700" fill="#e8edf5">Fairlead model router</text><text x="1444" y="450" font-size="23" fill="#aab7ca">127.0.0.1:8776 · every model call</text><text x="1444" y="480" font-size="23" fill="#aab7ca">own key in Credential Manager</text></g><g><line x1="1260" y1="445" x2="1400" y2="445" stroke="#5aa2ff" stroke-width="4"/><polygon points="1420,445 1398,432 1398,458" fill="#5aa2ff"/><text x="1340" y="431" font-size="21" fill="#5aa2ff" text-anchor="middle">own key</text></g><g><line x1="1520" y1="490" x2="1520" y2="525" stroke="#e2b04a" stroke-width="4"/><polygon points="1520,545 1507,523 1533,523" fill="#e2b04a"/></g><g><line x1="1740" y1="490" x2="1740" y2="525" stroke="#e2b04a" stroke-width="4"/><polygon points="1740,545 1727,523 1753,523" fill="#e2b04a"/></g><g><rect x="1420" y="545" width="200" height="110" rx="10" fill="#11203d" stroke="#2c4268" stroke-width="2"/><text x="1444" y="589" font-size="30" font-weight="700" fill="#e8edf5">OpenAI</text><text x="1444" y="625" font-size="23" fill="#aab7ca">cloud route</text></g><g><rect x="1640" y="545" width="200" height="110" rx="10" fill="#11203d" stroke="#2c4268" stroke-width="2"/><text x="1664" y="589" font-size="30" font-weight="700" fill="#e8edf5">Local</text><text x="1664" y="625" font-size="23" fill="#aab7ca">Ollama, etc.</text></g><g><rect x="1420" y="675" width="420" height="95" rx="10" fill="#11203d" stroke="#2c4268" stroke-width="2"/><text x="1444" y="719" font-size="30" font-weight="700" fill="#e8edf5">Semaphore</text><text x="1444" y="755" font-size="23" fill="#aab7ca">index and history as JSON</text></g><g><line x1="1260" y1="722" x2="1400" y2="722" stroke="#4cc38a" stroke-width="4"/><polygon points="1420,722 1398,709 1398,735" fill="#4cc38a"/><text x="1340" y="708" font-size="21" fill="#4cc38a" text-anchor="middle">export</text></g><g><rect x="1420" y="790" width="420" height="95" rx="10" fill="#11203d" stroke="#2c4268" stroke-width="2"/><text x="1444" y="834" font-size="30" font-weight="700" fill="#e8edf5">SnapShackle</text><text x="1444" y="870" font-size="23" fill="#aab7ca">captures with sidecar text</text></g><g><line x1="1420" y1="837" x2="1280" y2="837" stroke="#4cc38a" stroke-width="4"/><polygon points="1260,837 1282,824 1282,850" fill="#4cc38a"/><text x="1340" y="823" font-size="21" fill="#4cc38a" text-anchor="middle">names</text></g><g><rect x="80" y="925" width="1760" height="115" rx="10" fill="#1a2a1f" stroke="#4cc38a" stroke-width="2"/><text x="108" y="972" font-size="28" font-weight="700" fill="#4cc38a">APPROVAL GATE</text><text x="108" y="1010" font-size="24" fill="#e8edf5">1 Preview, nothing moves   →   2 type APPLY   →   3 journal with hashes   →   4 Undo restores every name</text><text x="1000" y="972" font-size="22" fill="#aab7ca">Images leave this PC only with -AllowCloudAI plus a vision consent, through Fairlead.</text></g></svg>