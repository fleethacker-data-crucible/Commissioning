<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" class=""><style>.draw{stroke-dasharray:1;stroke-dashoffset:0}</style><defs>
  <radialGradient id="bg" cx="50%" cy="30%" r="80%"><stop offset="0" stop-color="#13224a"/><stop offset="1" stop-color="#0a1428"/></radialGradient>
  <marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M1 1.5 L11 6 L1 10.5 Z" fill="#e2b04a"/></marker>
  <marker id="ahs" viewBox="0 0 12 12" refX="2" refY="6" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M11 1.5 L1 6 L11 10.5 Z" fill="#e2b04a"/></marker>
</defs>
<rect width="1920" height="1080" fill="url(#bg)"/>
<text x="60" y="70" fill="#e2b04a" font-size="22" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start" letter-spacing="6">HOW WINDLASS WORKS</text>
<text x="60" y="128" fill="#e8edf5" font-size="50" font-weight="700" font-family="Georgia, 'Times New Roman', serif" text-anchor="start">Windlass: architecture at a glance</text>
<text x="60" y="168" fill="#aab7ca" font-size="26" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">A model too big for memory, hauled through it one layer at a time, behind an OpenAI-style API. Loopback only.</text>
<g data-step="1">
  <text x="60" y="690" fill="#e2b04a" font-size="20" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start" letter-spacing="3">WHAT IT READS</text>
  <rect x="60" y="716" width="360" height="180" rx="12" fill="#101f3d" stroke="#2a3f6b" stroke-width="2"/><text x="84" y="760" fill="#f3d58d" font-size="30" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">A GGUF model file</text><text x="84" y="800" fill="#aab7ca" font-size="23" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">one file on your drive</text><text x="84" y="832" fill="#aab7ca" font-size="23" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">Llama 3.3 70B Q4_K_M: 42.5 GB</text><text x="84" y="864" fill="#aab7ca" font-size="23" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">read only, never downloaded</text>
  <rect x="470" y="196" width="880" height="724" rx="22" fill="#0d1a36" stroke="#e2b04a" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="500" y="236" fill="#e2b04a" font-size="20" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start" letter-spacing="3">THIS COMPUTER  ·  loopback only  ·  127.0.0.1:8777-8779</text>
  <rect x="510" y="262" width="800" height="150" rx="12" fill="#101f3d" stroke="#2a3f6b" stroke-width="2"/>
  <text x="540" y="306" fill="#e8edf5" font-size="30" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">Windlass server</text>
  <text x="540" y="346" fill="#aab7ca" font-size="24" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">OpenAI-style /v1 API, the browser UI and a tray icon</text>
  <text x="540" y="384" fill="#aab7ca" font-size="24" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">Host and Origin checked · FIFO queue, 8 waiting · keepalives</text>
  <path d="M 424 810 L 506 650" fill="none" stroke="#e2b04a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)" class="draw" pathLength="1"/><circle cx="450" cy="760" r="17" fill="#e2b04a"/><text x="450" y="768" fill="#0a1428" font-size="22" font-weight="800" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">1</text>
</g>
<g data-step="2">
  <rect x="510" y="440" width="800" height="240" rx="12" fill="#101f3d" stroke="#5fb3d0" stroke-width="2"/>
  <text x="540" y="484" fill="#5fb3d0" font-size="30" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">Layer streamer</text>
  <rect x="540" y="506" width="360" height="86" rx="10" fill="#17294f" stroke="#2a3f6b" stroke-width="2"/><text x="560" y="542" fill="#6fcf97" font-size="24" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">Slot A: layer N computing</text><text x="560" y="574" fill="#aab7ca" font-size="21" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">on the CPU, decoded on the fly</text>
  <rect x="920" y="506" width="360" height="86" rx="10" fill="#17294f" stroke="#2a3f6b" stroke-width="2"/><text x="940" y="542" fill="#f2994a" font-size="24" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">Slot B: layer N+1 loading</text><text x="940" y="574" fill="#aab7ca" font-size="21" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">prefetched from disk meanwhile</text>
  <text x="540" y="628" fill="#aab7ca" font-size="23" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">The KV cache stays in RAM across layers and tokens</text>
  <text x="540" y="662" fill="#aab7ca" font-size="23" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">About two layers resident: a 70B model needs about 2 GB plus cache</text>
  <path d="M 910 416 L 910 436" fill="none" stroke="#e2b04a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)" class="draw" pathLength="1"/><circle cx="950" cy="428" r="17" fill="#e2b04a"/><text x="950" y="436" fill="#0a1428" font-size="22" font-weight="800" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">2</text>
</g>
<g data-step="3">
  <text x="60" y="236" fill="#e2b04a" font-size="20" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start" letter-spacing="3">WHO CALLS IT</text>
  <rect x="60" y="262" width="360" height="170" rx="12" fill="#101f3d" stroke="#2a3f6b" stroke-width="2"/><text x="84" y="306" fill="#f3d58d" font-size="30" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">Browser UI</text><text x="84" y="344" fill="#aab7ca" font-size="23" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">load or swap a model, chat,</text><text x="84" y="376" fill="#aab7ca" font-size="23" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">playbook, log, End session</text>
  <path d="M 424 330 L 506 330" fill="none" stroke="#e2b04a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)" marker-start="url(#ahs)" class="draw" pathLength="1"/><circle cx="465" cy="300" r="17" fill="#e2b04a"/><text x="465" y="308" fill="#0a1428" font-size="22" font-weight="800" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">3</text>
  <rect x="60" y="460" width="360" height="170" rx="12" fill="#101f3d" stroke="#2a3f6b" stroke-width="2"/><text x="84" y="504" fill="#f3d58d" font-size="30" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">Any OpenAI client</text><text x="84" y="542" fill="#aab7ca" font-size="23" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">scripts and tools on this PC</text><text x="84" y="574" fill="#aab7ca" font-size="23" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">POST /v1/chat/completions</text>
  <path d="M 424 520 L 506 380" fill="none" stroke="#e2b04a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)" marker-start="url(#ahs)" class="draw" pathLength="1"/>
</g>
<g data-step="4">
  <rect x="510" y="710" width="390" height="180" rx="12" fill="#101f3d" stroke="#2a3f6b" stroke-width="2"/>
  <text x="534" y="754" fill="#f3d58d" font-size="28" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">Machine playbook</text>
  <text x="534" y="792" fill="#aab7ca" font-size="22" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">probe, eval, fidelity and real runs</text><text x="534" y="822" fill="#aab7ca" font-size="22" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">are measured here and saved;</text><text x="534" y="852" fill="#aab7ca" font-size="22" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">never measured shows as null</text>
  <rect x="920" y="710" width="390" height="180" rx="12" fill="#101f3d" stroke="#2a3f6b" stroke-width="2"/>
  <text x="944" y="754" fill="#f3d58d" font-size="28" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">Log and tray</text>
  <text x="944" y="792" fill="#aab7ca" font-size="22" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">log: ids, token counts, timings,</text><text x="944" y="822" fill="#aab7ca" font-size="22" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">never prompt or reply text;</text><text x="944" y="852" fill="#aab7ca" font-size="22" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">tray icon: Open and Quit</text>
  <circle cx="870" cy="735" r="17" fill="#e2b04a"/><text x="870" y="743" fill="#0a1428" font-size="22" font-weight="800" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">4</text>
</g>
<g data-step="5">
  <text x="1440" y="236" fill="#e2b04a" font-size="20" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start" letter-spacing="3">FLEET TOOLS</text>
  <rect x="1440" y="262" width="420" height="270" rx="12" fill="#101f3d" stroke="#2a3f6b" stroke-width="2"/><text x="1464" y="306" fill="#f3d58d" font-size="32" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">Fairlead</text><text x="1464" y="346" fill="#aab7ca" font-size="22" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">model router, 127.0.0.1:8776</text><text x="1464" y="376" fill="#aab7ca" font-size="22" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">provider Windlass: Local, 3600 s</text><text x="1464" y="406" fill="#aab7ca" font-size="22" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">route deep-local, reached by</text><text x="1464" y="436" fill="#aab7ca" font-size="22" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">name only, never in auto or fast</text><text x="1464" y="466" fill="#aab7ca" font-size="22" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">each app has its own client key</text>
  <path d="M 1436 420 H 1316 " fill="none" stroke="#5fb3d0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)" marker-start="url(#ahs)" class="draw" pathLength="1"/><circle cx="1380" cy="395" r="17" fill="#e2b04a"/><text x="1380" y="403" fill="#0a1428" font-size="22" font-weight="800" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">5</text>
  <rect x="1440" y="580" width="420" height="120" rx="12" fill="#101f3d" stroke="#2a3f6b" stroke-width="2"/><text x="1464" y="622" fill="#f3d58d" font-size="28" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">Fleet apps</text><text x="1464" y="658" fill="#aab7ca" font-size="22" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">any Fairlead client that asks</text><text x="1464" y="688" fill="#aab7ca" font-size="22" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">for model deep-local</text>
  <path d="M 1650 576 L 1650 536" fill="none" stroke="#e2b04a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)" class="draw" pathLength="1"/>
</g>
<g data-step="6">
  <rect x="1440" y="740" width="420" height="170" rx="12" fill="#101f3d" stroke="#2a3f6b" stroke-width="2" stroke-dasharray="10 8"/><rect x="1464" y="760" width="112" height="34" rx="17" fill="#f2994a22" stroke="#f2994a" stroke-width="2"/><text x="1478" y="784" fill="#f2994a" font-size="16" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start" letter-spacing="1.5">PLANNED</text><text x="1464" y="826" fill="#f2994a" font-size="27" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">GPU offload (Vulkan)</text><text x="1464" y="858" fill="#aab7ca" font-size="21" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">stream each layer into VRAM;</text><text x="1464" y="886" fill="#aab7ca" font-size="21" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">today the math runs on the CPU</text>
</g>
<g data-step="7">
  <rect x="60" y="944" width="1800" height="96" rx="14" fill="#0d1a36" stroke="#6fcf97" stroke-width="2"/>
  <text x="90" y="1000" fill="#6fcf97" font-size="22" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start" letter-spacing="4">SAFETY</text>
  <rect x="240" y="965" width="340" height="54" rx="27" fill="#6fcf9722" stroke="#6fcf97" stroke-width="2"/><text x="410" y="1000" fill="#e8edf5" font-size="23" font-weight="600" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">Loopback + Host/Origin</text>
  <rect x="600" y="965" width="400" height="54" rx="27" fill="#6fcf9722" stroke="#6fcf97" stroke-width="2"/><text x="800" y="1000" fill="#e8edf5" font-size="23" font-weight="600" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">No outgoing connections</text>
  <rect x="1020" y="965" width="420" height="54" rx="27" fill="#6fcf9722" stroke="#6fcf97" stroke-width="2"/><text x="1230" y="1000" fill="#e8edf5" font-size="23" font-weight="600" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">Never stops mid-reply</text>
  <rect x="1460" y="965" width="380" height="54" rx="27" fill="#6fcf9722" stroke="#6fcf97" stroke-width="2"/><text x="1650" y="1000" fill="#e8edf5" font-size="23" font-weight="600" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">No text in the log</text>
</g></svg>