<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" class=""><style>
  .draw { stroke-dasharray: 1; stroke-dashoffset: 0; }
  
  
  
  
</style><defs>
  <marker id="ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#c9a66b"/></marker>
  <marker id="ahs" viewBox="0 0 12 12" refX="3" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M11 1 L1 6 L11 11 Z" fill="#c9a66b"/></marker>
</defs>
<rect width="1920" height="1080" fill="#071a26"/>
<text x="60" y="70" fill="#c9a66b" font-size="22" font-weight="700" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start" letter-spacing="6">HOW LAZARETTE LITE WORKS</text>
<text x="60" y="128" fill="#f4ead6" font-size="50" font-weight="700" font-family="Cambria, 'Cambria Math', Georgia, serif" text-anchor="start">Lazarette Lite: architecture at a glance</text>
<text x="60" y="168" fill="#a9b4ba" font-size="26" font-weight="400" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start">A browser window on the Windows Credential Manager you already have, and a loader that hands Fleet tools their secrets by name.</text>
<g data-step="1">
  <rect x="60" y="196" width="1800" height="724" rx="22" fill="#0d2636" stroke="#c9a66b" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="90" y="236" fill="#c9a66b" font-size="20" font-weight="700" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start" letter-spacing="3">THIS COMPUTER  ·  one Windows user  ·  loopback only</text>
  <rect x="90" y="262" width="440" height="112" rx="10" fill="#183a52" stroke="#24465e" stroke-width="1"/><text x="114" y="304" fill="#f4ead6" font-size="26" font-weight="700" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start">Launch-LazaretteLite.bat</text><text x="114" y="342" fill="#a9b4ba" font-size="23" font-weight="400" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start">double-click, PowerShell 5.1</text>
  <rect x="90" y="410" width="440" height="202" rx="10" fill="#183a52" stroke="#24465e" stroke-width="1"/><text x="114" y="452" fill="#c9a66b" font-size="28" font-weight="700" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start">Your browser tab</text><text x="114" y="490" fill="#a9b4ba" font-size="23" font-weight="400" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start">the Lite web app, built</text><text x="114" y="520" fill="#a9b4ba" font-size="23" font-weight="400" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start">ahead of time and served</text><text x="114" y="550" fill="#a9b4ba" font-size="23" font-weight="400" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start">from this PC: no internet</text>
  <rect x="640" y="262" width="540" height="350" rx="10" fill="#112d40" stroke="#24465e" stroke-width="1"/><text x="670" y="308" fill="#f4ead6" font-size="30" font-weight="700" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start">Lite server</text><text x="670" y="342" fill="#a9b4ba" font-size="23" font-weight="400" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start">PowerShell 5.1, 127.0.0.1</text><text x="670" y="374" fill="#a9b4ba" font-size="23" font-weight="400" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start">port picked by Windows</text>
  <text x="670" y="418" fill="#f4ead6" font-size="22" font-weight="400" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start">serves the page · routes: list,</text><text x="670" y="448" fill="#f4ead6" font-size="22" font-weight="400" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start">add, edit, delete, reveal</text>
  <path d="M 532 318 L 636 318" fill="none" stroke="#c9a66b" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)" class="draw" pathLength="1"/><circle cx="584" cy="290" r="17" fill="#c9a66b"/><text x="584" y="298" fill="#071a26" font-size="22" font-weight="800" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="middle">1</text>
  <path d="M 532 520 L 636 520" fill="none" stroke="#c9a66b" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)" marker-start="url(#ahs)" class="draw" pathLength="1"/><circle cx="584" cy="492" r="17" fill="#c9a66b"/><text x="584" y="500" fill="#071a26" font-size="22" font-weight="800" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="middle">2</text>
</g>
<g data-step="2">
  <rect x="670" y="484" width="480" height="106" rx="10" fill="#183a52" stroke="#4fb386" stroke-width="1"/><text x="690" y="514" fill="#4fb386" font-size="17" font-weight="700" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start" letter-spacing="2">EVERY REQUEST IS CHECKED</text>
  <text x="690" y="542" fill="#f4ead6" font-size="22" font-weight="400" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start">caller runs as your Windows user</text><text x="690" y="572" fill="#f4ead6" font-size="22" font-weight="400" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start">Host + Origin · launch token · cookie</text>
</g>
<g data-step="3">
  <text x="1240" y="236" fill="#c9a66b" font-size="20" font-weight="700" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start" letter-spacing="3">WHERE THE SECRETS LIVE</text>
  <rect x="1240" y="262" width="590" height="214" rx="10" fill="#112d40" stroke="#24465e" stroke-width="1"/><text x="1264" y="308" fill="#c9a66b" font-size="30" font-weight="700" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start">Windows Credential Manager</text>
  <text x="1264" y="350" fill="#a9b4ba" font-size="23" font-weight="400" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start">generic credentials of this Windows user</text><text x="1264" y="382" fill="#a9b4ba" font-size="23" font-weight="400" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start">named lazarette-lite/&lt;service>/&lt;user></text><text x="1264" y="414" fill="#a9b4ba" font-size="23" font-weight="400" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start">Windows stores and protects them:</text><text x="1264" y="446" fill="#a9b4ba" font-size="23" font-weight="400" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start">Lite has no vault engine of its own</text>
  <path d="M 1184 400 L 1236 400" fill="none" stroke="#c9a66b" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)" marker-start="url(#ahs)" class="draw" pathLength="1"/>
</g>
<g data-step="4">
  <text x="90" y="662" fill="#c9a66b" font-size="20" font-weight="700" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start" letter-spacing="3">HOW A FLEET TOOL GETS ITS SECRET</text>
  <rect x="90" y="690" width="440" height="190" rx="10" fill="#112d40" stroke="#24465e" stroke-width="1"/><text x="114" y="732" fill="#f4ead6" font-size="28" font-weight="700" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start">A Fleet tool</text><text x="114" y="770" fill="#a9b4ba" font-size="22" font-weight="400" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start">started through</text><text x="114" y="800" fill="#a9b4ba" font-size="22" font-weight="400" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start">Start-LiteFleet.ps1, which sets</text><text x="114" y="830" fill="#a9b4ba" font-size="22" font-weight="400" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start">LAZARETTE_PATH and ARC_PATH</text>
  <rect x="640" y="690" width="540" height="190" rx="10" fill="#112d40" stroke="#24465e" stroke-width="1"/><text x="664" y="732" fill="#c9a66b" font-size="27" font-weight="700" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start">lib\Lazarette.ps1 · Arc.ps1</text><text x="664" y="770" fill="#a9b4ba" font-size="22" font-weight="400" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start">Get-LazaretteSecret, Get-ArcSecret</text><text x="664" y="800" fill="#a9b4ba" font-size="22" font-weight="400" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start">by service and user: the same</text><text x="664" y="830" fill="#a9b4ba" font-size="22" font-weight="400" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start">names Lazarette answers to</text>
  <path d="M 534 785 L 636 785" fill="none" stroke="#c9a66b" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)" class="draw" pathLength="1"/><circle cx="585" cy="757" r="17" fill="#c9a66b"/><text x="585" y="765" fill="#071a26" font-size="22" font-weight="800" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="middle">3</text>
  <path d="M 1184 785 L 1370 785 L 1370 480" fill="none" stroke="#c9a66b" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)" class="draw" pathLength="1"/><circle cx="1370" cy="650" r="17" fill="#c9a66b"/><text x="1370" y="658" fill="#071a26" font-size="22" font-weight="800" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="middle">4</text>
</g>
<g data-step="5">
  <rect x="1450" y="600" width="380" height="280" rx="10" fill="#112d40" stroke="#24465e" stroke-width="1" stroke-dasharray="10 8"/><text x="1474" y="644" fill="#f4ead6" font-size="28" font-weight="700" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start">Full Lazarette only</text>
  <text x="1474" y="686" fill="#a9b4ba" font-size="22" font-weight="400" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start">custom fields,</text><text x="1474" y="716" fill="#a9b4ba" font-size="22" font-weight="400" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start">and Lazarette’s key sharing</text><text x="1474" y="746" fill="#a9b4ba" font-size="22" font-weight="400" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start">with Fairlead: a separate</text><text x="1474" y="776" fill="#a9b4ba" font-size="22" font-weight="400" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start">integration, not in Lite</text><rect x="1474" y="818" width="171" height="34" rx="6" fill="#e0a44326" stroke="#e0a443" stroke-width="1"/><text x="1488" y="842" fill="#e0a443" font-size="17" font-weight="700" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start" letter-spacing="1.5">NOT IN LITE</text>
</g>
<g data-step="6">
  <rect x="60" y="944" width="1800" height="96" rx="14" fill="#0d2636" stroke="#4fb386" stroke-width="2"/>
  <text x="90" y="1000" fill="#4fb386" font-size="22" font-weight="700" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="start" letter-spacing="4">SAFETY</text>
  <rect x="240" y="965" width="360" height="54" rx="6" fill="#4fb38626" stroke="#4fb386" stroke-width="1"/><text x="420" y="1000" fill="#f4ead6" font-size="24" font-weight="600" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="middle">Hidden until you Reveal</text>
  <rect x="620" y="965" width="330" height="54" rx="6" fill="#4fb38626" stroke="#4fb386" stroke-width="1"/><text x="785" y="1000" fill="#f4ead6" font-size="24" font-weight="600" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="middle">Delete asks first</text>
  <rect x="970" y="965" width="450" height="54" rx="6" fill="#4fb38626" stroke="#4fb386" stroke-width="1"/><text x="1195" y="1000" fill="#f4ead6" font-size="24" font-weight="600" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="middle">Only its own prefix is listed</text>
  <rect x="1440" y="965" width="400" height="54" rx="6" fill="#4fb38626" stroke="#4fb386" stroke-width="1"/><text x="1640" y="1000" fill="#f4ead6" font-size="24" font-weight="600" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" text-anchor="middle">No outbound requests</text>
</g></svg>