<?xml version="1.0" encoding="UTF-8"?>
<svg id="arch" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" class="static">
<style>
  .bg{fill:url(#g)}
  .kick{fill:#E2B04A;font-size:26px;font-weight:600;letter-spacing:5px}
  .head{fill:#E8EDF5;font-size:58px;font-weight:700}
  .frame{fill:rgba(255,255,255,0.025);stroke:#5b6b86;stroke-width:2;stroke-dasharray:3 9;stroke-linecap:round}
  .ftag{fill:#8FA0BB;font-size:24px;letter-spacing:2px;font-weight:600}
  .box{fill:#12203d;stroke:#3d527a;stroke-width:2.5}
  .eng{fill:#0f1c38;stroke:#E2B04A;stroke-width:3}
  .gold{fill:#2a2412;stroke:#E2B04A;stroke-width:3}
  .plan{fill:rgba(255,255,255,0.03);stroke:#E2B04A;stroke-width:2.5;stroke-dasharray:10 8}
  .t{fill:#E8EDF5;font-size:32px;font-weight:700}
  .tg{fill:#E2B04A;font-size:32px;font-weight:700}
  .s{fill:#AAB7CA;font-size:24px}
  .sg{fill:#E9C77A;font-size:24px}
  .tag{fill:#E2B04A;font-size:22px;font-weight:700;letter-spacing:1px}
  .ln{fill:none;stroke:#8FA0BB;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .lg{fill:none;stroke:#E2B04A;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  .ld{fill:none;stroke:#E2B04A;stroke-width:4;stroke-linecap:round;stroke-dasharray:3 12;opacity:.9}
  .banner{fill:#E2B04A}
  .bt{fill:#0A1428;font-size:34px;font-weight:700}
  .st{opacity:0;transform:translateY(16px);transition:opacity .8s ease,transform .8s ease}
  .st.on{opacity:1;transform:none}
  .st .dash{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.1s ease .25s}
  .st.on .dash{stroke-dashoffset:0}
  .st.on.cur .box,.st.on.cur .eng,.st.on.cur .plan{stroke:#F3CB72;filter:drop-shadow(0 0 12px rgba(226,176,74,.55))}
  .st.on.cur .gold{filter:drop-shadow(0 0 16px rgba(226,176,74,.7))}
  @keyframes pulse{0%,100%{filter:drop-shadow(0 0 4px rgba(226,176,74,.3))}50%{filter:drop-shadow(0 0 22px rgba(226,176,74,.95))}}
  .pulse .gold{animation:pulse 1.8s ease-in-out infinite}
  .static .st{opacity:1;transform:none;transition:none}
  .static .st .dash{stroke-dashoffset:0;transition:none}
  .static .st.cur .box{filter:none}
</style>
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0A1428"></stop><stop offset="1" stop-color="#0d1a33"></stop></linearGradient>
  <marker id="ah" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#8FA0BB"></path></marker>
  <marker id="ag" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#E2B04A"></path></marker>
</defs>
<rect class="bg" width="1920" height="1080"></rect>

<text class="kick" x="80" y="70">FAIRLEAD · ARCHITECTURE AT A GLANCE</text>
<text class="head" x="80" y="130">One address for every model.</text>

<!-- step 1: the machine, the tools, the browser -->
<g class="st on" data-s="1">
  <rect class="frame" x="60" y="165" width="1190" height="830" rx="30"></rect>
  <text class="ftag" x="92" y="207">ON YOUR PC · 127.0.0.1:8776</text>
  <rect class="box" x="96" y="240" width="300" height="250" rx="18"></rect>
  <text class="t" x="120" y="290">Fleet tools</text>
  <text class="s" x="120" y="330">Halyard · Packet Rat</text>
  <text class="s" x="120" y="362">Eight Bells · Semaphore</text>
  <text class="s" x="120" y="394">Shellback · Claude Code</text>
  <text class="sg" x="120" y="446">each holds its own fl- key</text>
  <text class="sg" x="120" y="474">OpenAI or Anthropic API</text>
  <rect class="box" x="96" y="520" width="300" height="140" rx="18"></rect>
  <text class="t" x="120" y="570">Browser UI</text>
  <text class="s" x="120" y="608">set up and watch</text>
  <text class="s" x="120" y="640">per-session token</text>
  <rect class="box" x="96" y="690" width="300" height="120" rx="18"></rect>
  <text class="t" x="120" y="738">PowerShell 5.1</text>
  <text class="s" x="120" y="774">launcher · tray icon</text>
  <rect class="eng" x="470" y="240" width="740" height="640" rx="24"></rect>
  <text class="tg" x="506" y="288">Fairlead engine · C#</text>
  <path class="lg dash" pathLength="1" d="M400 330 H466" marker-end="url(#ag)"></path>
  <path class="ln dash" pathLength="1" d="M400 590 H466" marker-start="url(#ah)" marker-end="url(#ah)"></path>
  <path class="ln dash" pathLength="1" d="M400 750 H466" marker-end="url(#ah)"></path>
</g>

<!-- step 2: inside the engine, in the order a request travels -->
<g class="st on" data-s="2">
  <rect class="box" x="506" y="316" width="330" height="116" rx="16"></rect>
  <text class="t" x="528" y="360">1 Gateway</text>
  <text class="s" x="528" y="398">/v1 · client key check</text>
  <rect class="box" x="860" y="316" width="330" height="116" rx="16"></rect>
  <text class="t" x="882" y="360">2 Routing</text>
  <text class="s" x="882" y="398">routes · rules · aliases</text>
  <rect class="box" x="860" y="456" width="330" height="116" rx="16"></rect>
  <text class="t" x="882" y="500">3 Resilience</text>
  <text class="s" x="882" y="538">failover · Kedge mode</text>
  <rect class="box" x="506" y="456" width="330" height="116" rx="16"></rect>
  <text class="t" x="528" y="500">4 Request log</text>
  <text class="s" x="528" y="538">decision trace, no prompts</text>
  <path class="ln dash" pathLength="1" d="M838 374 H858" marker-end="url(#ah)"></path>
  <path class="ln dash" pathLength="1" d="M1025 436 V452" marker-end="url(#ah)"></path>
  <path class="ln dash" pathLength="1" d="M858 514 H838" marker-end="url(#ah)"></path>
  <rect class="box" x="506" y="600" width="330" height="100" rx="16"></rect>
  <text class="t" x="528" y="644">Config store</text>
  <text class="s" x="528" y="680">fairlead.json · DPAPI keys</text>
</g>

<!-- step 3: the only way out, and the providers -->
<g class="st on" data-s="3">
  <rect class="gold" x="506" y="732" width="684" height="112" rx="16"></rect>
  <text class="tg" x="528" y="778">Upstream client</text>
  <text class="sg" x="528" y="818">the only outbound HTTP · no redirects</text>
  <rect class="box" x="1330" y="500" width="530" height="360" rx="22"></rect>
  <text class="t" x="1356" y="548">Providers</text>
  <rect class="box" x="1356" y="568" width="226" height="130" rx="12"></rect>
  <text class="ftag" x="1372" y="598">LOCAL</text>
  <text class="s" x="1372" y="636">Ollama</text>
  <text class="s" x="1372" y="670">Windlass</text>
  <rect class="box" x="1608" y="568" width="226" height="130" rx="12"></rect>
  <text class="ftag" x="1624" y="598">CLOUD</text>
  <text class="s" x="1624" y="636">OpenAI</text>
  <text class="s" x="1624" y="670">OpenRouter</text>
  <text class="s" x="1356" y="750">Failover tries the next target</text>
  <text class="s" x="1356" y="784">before any byte reaches the tool.</text>
  <text class="sg" x="1356" y="826">AI gateway model files: read-only</text>
  <path class="lg dash" pathLength="1" d="M1194 790 L1326 740" marker-end="url(#ag)"></path>
</g>

<!-- step 4: Lazarette -->
<g class="st on" data-s="4">
  <rect class="box" x="1330" y="365" width="530" height="110" rx="22"></rect>
  <text class="t" x="1356" y="413">Lazarette vault</text>
  <text class="s" x="1356" y="452">keys by name, shared with Fairlead</text>
  <rect class="box" x="1330" y="165" width="530" height="132" rx="22"></rect>
  <text class="t" x="1356" y="213">Keys: memory only</text>
  <text class="s" x="1356" y="252">never on disk, never shown in the UI</text>
  <text class="s" x="1356" y="282">pairing code, then read by name</text>
  <path class="ln dash" pathLength="1" d="M1330 410 L1214 372" marker-end="url(#ah)"></path>
</g>

<!-- step 5: privacy -->
<g class="st on" data-s="5">
  <rect class="gold" x="506" y="900" width="684" height="76" rx="16"></rect>
  <text class="tg" x="528" y="948">X-Fairlead-Privacy: local</text>
  <text class="sg" x="1170" y="948" text-anchor="end">stays on this PC</text>
  <path class="lg dash" pathLength="1" d="M1190 938 C1260 938 1300 880 1330 868" marker-end="url(#ag)"></path>
</g>

<!-- step 6: planned -->
<g class="st on" data-s="6">
  <rect class="plan" x="1330" y="900" width="530" height="96" rx="18"></rect>
  <text class="tag" x="1352" y="934">PLANNED</text>
  <text class="s" x="1352" y="970">git hosts and databases · semantic routing</text>
</g>

<!-- step 7: the rule -->
<g class="st on" data-s="7">
  <rect class="banner" x="1090" y="42" width="770" height="100" rx="50"></rect>
  <text class="bt" x="1475" y="105" text-anchor="middle">Every request leaves a trace.</text>
</g>
</svg>
