<?xml version="1.0" encoding="UTF-8"?>
<svg id="arch" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" class="static">
<style>
  .bg{fill:url(#g)}
  .kick{fill:#E2B04A;font-size:26px;font-weight:600;letter-spacing:5px}
  .head{fill:#E8EDF5;font-size:58px;font-weight:700}
  .frame{fill:rgba(255,255,255,0.025);stroke:#5b6b86;stroke-width:2;stroke-dasharray:3 9;stroke-linecap:round}
  .ftag{fill:#8FA0BB;font-size:24px;letter-spacing:2px;font-weight:600}
  .box{fill:#12203d;stroke:#3d527a;stroke-width:2.5}
  .eng{fill:#0f1c38;stroke:#E2B04A;stroke-width:3}
  .gold{fill:#2a2412;stroke:#E2B04A;stroke-width:3}
  .plan{fill:rgba(255,255,255,0.03);stroke:#E2B04A;stroke-width:2.5;stroke-dasharray:10 8}
  .t{fill:#E8EDF5;font-size:32px;font-weight:700}
  .tg{fill:#E2B04A;font-size:32px;font-weight:700}
  .s{fill:#AAB7CA;font-size:24px}
  .sg{fill:#E9C77A;font-size:24px}
  .tag{fill:#E2B04A;font-size:22px;font-weight:700;letter-spacing:1px}
  .ln{fill:none;stroke:#8FA0BB;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .lg{fill:none;stroke:#E2B04A;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  .ld{fill:none;stroke:#E2B04A;stroke-width:4;stroke-linecap:round;stroke-dasharray:3 12;opacity:.9}
  .banner{fill:#E2B04A}
  .bt{fill:#0A1428;font-size:34px;font-weight:700}
  .st{opacity:0;transform:translateY(16px);transition:opacity .8s ease,transform .8s ease}
  .st.on{opacity:1;transform:none}
  .st .dash{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.1s ease .25s}
  .st.on .dash{stroke-dashoffset:0}
  .st.on.cur .box,.st.on.cur .eng,.st.on.cur .plan{stroke:#F3CB72;filter:drop-shadow(0 0 12px rgba(226,176,74,.55))}
  .st.on.cur .gold{filter:drop-shadow(0 0 16px rgba(226,176,74,.7))}
  @keyframes pulse{0%,100%{filter:drop-shadow(0 0 4px rgba(226,176,74,.3))}50%{filter:drop-shadow(0 0 22px rgba(226,176,74,.95))}}
  .pulse .gold{animation:pulse 1.8s ease-in-out infinite}
  .static .st{opacity:1;transform:none;transition:none}
  .static .st .dash{stroke-dashoffset:0;transition:none}
  .static .st.cur .box{filter:none}
</style>
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0A1428"></stop><stop offset="1" stop-color="#0d1a33"></stop></linearGradient>
  <marker id="ah" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#8FA0BB"></path></marker>
  <marker id="ag" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#E2B04A"></path></marker>
</defs>
<rect class="bg" width="1920" height="1080"></rect>

<text class="kick" x="80" y="70">CAPSTAN · ARCHITECTURE AT A GLANCE</text>
<text class="head" x="80" y="130">Record. Cut. Export.</text>

<!-- step 1: the machine, launcher, window -->
<g class="st on" data-s="1">
  <rect class="frame" x="60" y="165" width="1260" height="830" rx="30"></rect>
  <text class="ftag" x="92" y="207">ON YOUR PC · 127.0.0.1 · NO NETWORK CALLS</text>
  <rect class="box" x="96" y="240" width="330" height="190" rx="18"></rect>
  <text class="t" x="120" y="290">Launcher</text>
  <text class="s" x="120" y="330">Launch-Capstan.bat</text>
  <text class="s" x="120" y="364">PowerShell 5.1 · no admin</text>
  <text class="s" x="120" y="398">host: captures · speech · hotkeys</text>
  <rect class="box" x="96" y="470" width="330" height="190" rx="18"></rect>
  <text class="t" x="120" y="520">Browser window</text>
  <text class="s" x="120" y="560">Edge or Chrome · React UI</text>
  <text class="s" x="120" y="594">timeline · preview</text>
  <text class="s" x="120" y="628">WebCodecs, no install</text>
  <path class="ln dash" pathLength="1" d="M261 434 V466" marker-end="url(#ah)"></path>
  <rect class="box" x="96" y="700" width="330" height="260" rx="18"></rect>
  <text class="t" x="120" y="750">Storage</text>
  <text class="s" x="120" y="790">IndexedDB: media and</text>
  <text class="s" x="120" y="822">projects, this address only</text>
  <text class="s" x="120" y="862">.capstanz package</text>
  <text class="s" x="120" y="894">.capstan project file</text>
  <text class="s" x="120" y="926">saved to disk on demand</text>
  <path class="ln dash" pathLength="1" d="M261 664 V696" marker-start="url(#ah)" marker-end="url(#ah)"></path>
  <rect class="eng" x="480" y="240" width="800" height="720" rx="24"></rect>
  <text class="tg" x="516" y="288">Capstan engine · in the browser</text>
  <path class="ln dash" pathLength="1" d="M430 565 H476" marker-end="url(#ah)"></path>
</g>

<!-- step 2: pipeline -->
<g class="st on" data-s="2">
  <rect class="gold" x="516" y="320" width="728" height="120" rx="16"></rect>
  <text class="tg" x="540" y="366">1 · Record</text>
  <text class="sg" x="540" y="408">tab or window only · other sources refused · WebM fallback</text>
  <rect class="box" x="516" y="476" width="728" height="110" rx="16"></rect>
  <text class="t" x="540" y="522">2 · Edit</text>
  <text class="s" x="540" y="560">timeline · pure edits · undo · offline speech-to-text</text>
  <rect class="gold" x="516" y="622" width="728" height="120" rx="16"></rect>
  <text class="tg" x="540" y="668">3 · Redact and caption</text>
  <text class="sg" x="540" y="710">blur and pixelate regions · captions · drawn above every track</text>
  <rect class="box" x="516" y="778" width="728" height="150" rx="16"></rect>
  <text class="t" x="540" y="824">4 · Export</text>
  <text class="s" x="540" y="862">one compositor for preview and export · H.264 + AAC MP4</text>
  <text class="s" x="540" y="898">hardware encoder, software fallback · chapters inside the file</text>
  <path class="lg dash" pathLength="1" d="M880 442 V472" marker-end="url(#ag)"></path>
  <path class="lg dash" pathLength="1" d="M880 588 V618" marker-end="url(#ag)"></path>
  <path class="lg dash" pathLength="1" d="M880 744 V774" marker-end="url(#ag)"></path>
</g>

<!-- step 3: Fleet inputs -->
<g class="st on" data-s="3">
  <rect class="box" x="1380" y="165" width="480" height="170" rx="22"></rect>
  <text class="t" x="1406" y="213">SnapShackle</text>
  <text class="s" x="1406" y="252">captures and OCR text, in</text>
  <text class="s" x="1406" y="286">host route · read only</text>
  <text class="s" x="1406" y="320">a narration WAV imports too</text>
  <path class="ln dash" pathLength="1" d="M1376 270 C1330 300 1320 420 1248 440" marker-end="url(#ah)"></path>
</g>

<!-- step 4: Fleet outputs -->
<g class="st on" data-s="4">
  <rect class="box" x="1380" y="385" width="480" height="210" rx="22"></rect>
  <text class="t" x="1406" y="433">Scrimshaw</text>
  <text class="s" x="1406" y="472">MP4 · captions .vtt/.srt</text>
  <text class="s" x="1406" y="506">chapters list · plain files,</text>
  <text class="s" x="1406" y="540">nothing pushed anywhere</text>
  <text class="s" x="1406" y="574">(any player reads them too)</text>
  <path class="lg dash" pathLength="1" d="M1248 840 C1330 840 1330 560 1376 520" marker-end="url(#ag)"></path>
  <rect class="box" x="1380" y="635" width="480" height="150" rx="22"></rect>
  <text class="t" x="1406" y="683">capstan.ps1</text>
  <text class="s" x="1406" y="722">Fleet action CLI · 139 actions</text>
  <text class="s" x="1406" y="756">destructive ones need --yes</text>
  <path class="ln dash" pathLength="1" d="M1376 720 C1330 720 1300 650 1248 640" marker-end="url(#ah)"></path>
</g>

<!-- step 5: planned and not used -->
<g class="st on" data-s="5">
  <rect class="plan" x="1380" y="835" width="480" height="160" rx="18"></rect>
  <text class="tag" x="1404" y="872">PLANNED</text>
  <text class="s" x="1404" y="908">background removal</text>
  <text class="s" x="1404" y="942">Capstan-CLI.bat launcher</text>
  <text class="s" x="1404" y="976">no model today, so no Fairlead</text>
</g>

<!-- step 6: the rule -->
<g class="st on" data-s="6">
  <rect class="banner" x="1100" y="42" width="750" height="100" rx="50"></rect>
  <text class="bt" x="1475" y="105" text-anchor="middle">Media never leaves this PC.</text>
</g>
</svg>
