  <rect x="240" y="965" width="380" height="54" rx="27" fill="#6fcf9722" stroke="#6fcf97" stroke-width="2"/><text x="430" y="1000" fill="#e8edf5" font-size="23" font-weight="600" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">localhost + session token</text>
  <rect x="640" y="965" width="400" height="54" rx="27" fill="#6fcf9722" stroke="#6fcf97" stroke-width="2"/><text x="840" y="1000" fill="#e8edf5" font-size="23" font-weight="600" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">Project-only file access</text>
