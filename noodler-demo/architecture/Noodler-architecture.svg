<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" class=""><style>.draw{stroke-dasharray:1;stroke-dashoffset:0}</style><defs>
  <radialGradient id="bg" cx="50%" cy="30%" r="80%"><stop offset="0" stop-color="#13224a"/><stop offset="1" stop-color="#0a1428"/></radialGradient>
  <marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M1 1.5 L11 6 L1 10.5 Z" fill="#e2b04a"/></marker>
  <marker id="ahs" viewBox="0 0 12 12" refX="2" refY="6" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M11 1.5 L1 6 L11 10.5 Z" fill="#e2b04a"/></marker>
</defs>
<rect width="1920" height="1080" fill="url(#bg)"/>
<text x="60" y="70" fill="#e2b04a" font-size="22" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start" letter-spacing="6">HOW DATA NOODLER WORKS</text>
<text x="60" y="128" fill="#e8edf5" font-size="50" font-weight="700" font-family="Georgia, 'Times New Roman', serif" text-anchor="start">Data Noodler: architecture at a glance</text>
<text x="60" y="168" fill="#aab7ca" font-size="26" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">Big flat files in, a clean table and a dashboard out. One computer, no installs, no network calls.</text>
<g data-step="1">
  <rect x="470" y="196" width="880" height="724" rx="22" fill="#0d1a36" stroke="#e2b04a" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="500" y="236" fill="#e2b04a" font-size="20" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start" letter-spacing="3">THIS COMPUTER  ·  localhost only</text>
  <rect x="510" y="262" width="800" height="214" rx="12" fill="#101f3d" stroke="#2a3f6b" stroke-width="2"/>
  <text x="540" y="308" fill="#e8edf5" font-size="30" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">Your browser: the pages</text>
  <rect x="540" y="328" width="360" height="100" rx="10" fill="#17294f" stroke="#2a3f6b" stroke-width="2"/><text x="560" y="364" fill="#5fb3d0" font-size="26" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">Import · Transform</text><text x="560" y="400" fill="#aab7ca" font-size="23" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">pick a file · write SQL</text>
  <rect x="920" y="328" width="360" height="100" rx="10" fill="#17294f" stroke="#2a3f6b" stroke-width="2"/><text x="940" y="364" fill="#6fcf97" font-size="26" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">Dashboard · Publish</text><text x="940" y="400" fill="#aab7ca" font-size="23" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">drop fields · export</text>
  <text x="540" y="458" fill="#aab7ca" font-size="20" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">Plain HTML and JavaScript · charts are bundled, nothing loads from the internet</text>
  <rect x="510" y="556" width="380" height="196" rx="12" fill="#101f3d" stroke="#2a3f6b" stroke-width="2"/>
  <text x="534" y="600" fill="#e8edf5" font-size="28" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">Server (PowerShell 5.1)</text>
  <text x="534" y="640" fill="#aab7ca" font-size="22" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">localhost only</text><text x="534" y="672" fill="#aab7ca" font-size="22" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">token + Host + Origin checks</text><text x="534" y="704" fill="#aab7ca" font-size="22" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">files only inside the project</text>
  <rect x="510" y="794" width="330" height="106" rx="10" fill="#17294f" stroke="#2a3f6b" stroke-width="2"/><text x="530" y="834" fill="#f3d58d" font-size="25" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">Data_Noodler.bat</text><text x="530" y="870" fill="#aab7ca" font-size="23" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">double-click to start</text>
  <path d="M 675 794 L 675 757" fill="none" stroke="#e2b04a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)" class="draw" pathLength="1"/><circle cx="715" cy="776" r="17" fill="#e2b04a"/><text x="715" y="784" fill="#0a1428" font-size="22" font-weight="800" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">1</text><text x="740" y="782" fill="#aab7ca" font-size="18" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">starts it</text>
  <path d="M 700 556 L 700 480" fill="none" stroke="#e2b04a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)" marker-start="url(#ahs)" class="draw" pathLength="1"/><circle cx="745" cy="518" r="17" fill="#e2b04a"/><text x="745" y="526" fill="#0a1428" font-size="22" font-weight="800" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">2</text><text x="770" y="524" fill="#aab7ca" font-size="18" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">HTTP on localhost</text>
</g>
<g data-step="2">
  <rect x="930" y="556" width="380" height="196" rx="12" fill="#101f3d" stroke="#2a3f6b" stroke-width="2"/>
  <text x="954" y="600" fill="#e8edf5" font-size="28" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">Data engine (C#)</text>
  <text x="954" y="640" fill="#aab7ca" font-size="22" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">compiled in memory at start</text><text x="954" y="672" fill="#aab7ca" font-size="22" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">Arrow tables in RAM · SQL</text><text x="954" y="704" fill="#aab7ca" font-size="22" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">spills to disk when RAM is short</text>
  <path d="M 894 654 L 926 654" fill="none" stroke="#e2b04a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)" marker-start="url(#ahs)" class="draw" pathLength="1"/>
