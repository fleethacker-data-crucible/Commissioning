  <path d="M 1120 756 L 1120 790" fill="none" stroke="#e2b04a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)" marker-start="url(#ahs)" class="draw" pathLength="1"/><circle cx="1160" cy="775" r="17" fill="#e2b04a"/><text x="1160" y="783" fill="#0a1428" font-size="22" font-weight="800" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">3</text><text x="1185" y="781" fill="#aab7ca" font-size="18" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">reads and writes</text>
</g>
<g data-step="3">
  <text x="60" y="236" fill="#e2b04a" font-size="20" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start" letter-spacing="3">WHAT GOES IN</text>
  <rect x="60" y="262" width="360" height="214" rx="12" fill="#101f3d" stroke="#2a3f6b" stroke-width="2"/><text x="84" y="306" fill="#f3d58d" font-size="32" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">Raw files</text><text x="84" y="346" fill="#aab7ca" font-size="23" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">CSV, Parquet, Arrow,</text><text x="84" y="378" fill="#aab7ca" font-size="23" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">SQLite. Copied into the</text><text x="84" y="410" fill="#aab7ca" font-size="23" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">project, or read in place</text><text x="84" y="442" fill="#aab7ca" font-size="23" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">from a drive or share</text>
  <path d="M 424 370 L 506 370" fill="none" stroke="#e2b04a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)" class="draw" pathLength="1"/>
</g>
<g data-step="4">
  <text x="60" y="506" fill="#e2b04a" font-size="20" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start" letter-spacing="3">THE WORK IS PLAIN SQL</text>
  <rect x="60" y="532" width="360" height="188" rx="12" fill="#101f3d" stroke="#5fb3d0" stroke-width="2"/><text x="84" y="576" fill="#5fb3d0" font-size="29" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">Named queries</text><text x="84" y="614" fill="#aab7ca" font-size="23" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">an Oracle-style dialect</text><text x="84" y="646" fill="#aab7ca" font-size="23" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">saved with the project;</text><text x="84" y="678" fill="#aab7ca" font-size="23" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">the result is a CLEAN_ table</text>
  <path d="M 506 640 L 428 640" fill="none" stroke="#5fb3d0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)" class="draw" pathLength="1"/>
</g>
<g data-step="5">
  <text x="1440" y="236" fill="#e2b04a" font-size="20" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start" letter-spacing="3">WHAT COMES OUT</text>
  <rect x="1440" y="262" width="420" height="190" rx="12" fill="#101f3d" stroke="#2a3f6b" stroke-width="2"/><text x="1464" y="306" fill="#f3d58d" font-size="32" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">Dashboards</text><text x="1464" y="346" fill="#aab7ca" font-size="23" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">image, PDF, PowerPoint slide,</text><text x="1464" y="378" fill="#aab7ca" font-size="23" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">or a one-file web page that</text><text x="1464" y="410" fill="#aab7ca" font-size="23" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">needs no server or data</text>
