  <rect x="1440" y="478" width="420" height="170" rx="12" fill="#101f3d" stroke="#2a3f6b" stroke-width="2"/><text x="1464" y="522" fill="#f3d58d" font-size="32" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">Data files</text><text x="1464" y="562" fill="#aab7ca" font-size="23" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">CSV, Parquet or SQLite</text><text x="1464" y="594" fill="#aab7ca" font-size="23" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">copies of any table</text>
  <path d="M 1314 600 H 1376 V 563 H 1436" fill="none" stroke="#e2b04a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)" class="draw" pathLength="1"/><circle cx="1376" cy="582" r="17" fill="#e2b04a"/><text x="1376" y="590" fill="#0a1428" font-size="22" font-weight="800" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="middle">4</text>
</g>
<g data-step="6">
  <text x="1440" y="690" fill="#e2b04a" font-size="20" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start" letter-spacing="3">FLEET TOOLS</text>
  <rect x="1440" y="710" width="420" height="100" rx="12" fill="#101f3d" stroke="#2a3f6b" stroke-width="2"/><text x="1464" y="750" fill="#f3d58d" font-size="28" font-weight="700" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">Semaphore</text><text x="1464" y="790" fill="#aab7ca" font-size="23" font-weight="400" font-family="'Segoe UI', system-ui, sans-serif" text-anchor="start">takes the CSV: a plain file</text>
